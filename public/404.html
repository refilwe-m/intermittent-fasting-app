<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fast Track</title>
    <script>
      // GitHub Pages SPA redirect.
      // Pages serves this 404 for any unknown path. We translate the path into
      // a query string and bounce to the app root, where a snippet in index.html
      // restores the real URL for the client-side router.
      // segmentCount = number of path segments to KEEP as the base (the repo name).
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
