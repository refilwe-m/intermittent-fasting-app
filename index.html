  <script>
    // GitHub Pages SPA redirect decoder — restores the real URL that 404.html
    // encoded into a query string, so the client-side router sees the right path.
    (function () {
      var l = window.location
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?')
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash)
      }
    })()
  </script>
